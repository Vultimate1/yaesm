name: build-fedora-rpm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  manual-current:
    name: Check generated manual
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if sh packaging/check-manual.sh; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: manual-current
    if: needs.manual-current.outputs.current == 'true'
    name: Build package for latest Fedora
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --privileged

    steps:
      - name: Install packaging tools
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            git \
            glibc-langpack-en \
            mock \
            rpm-build \
            rpmlint \
            systemd

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage RPM sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p \
            "$HOME/rpmbuild/SOURCES" \
            "$HOME/rpmbuild/SPECS" \
            "$HOME/rpmbuild/SRPMS"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          changelog_date=$(LC_ALL=C git log -1 \
            --date='format:%a %b %d %Y' --format=%cd)
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@CHANGELOG_DATE@/$changelog_date/" \
            packaging/fedora/yaesm.spec \
            > "$HOME/rpmbuild/SPECS/yaesm.spec"
          git archive --format=tar.gz --prefix="yaesm-$version/" \
            --output="$HOME/rpmbuild/SOURCES/yaesm-$version.tar.gz" HEAD
          rpmbuild -bs --nodeps "$HOME/rpmbuild/SPECS/yaesm.spec"

      - name: Build Fedora package
        run: |
          mkdir dist
          mock --root "fedora-$(rpm --eval '%{fedora}')-x86_64" \
            --isolation=simple \
            --resultdir="$PWD/dist" \
            --rebuild "$HOME"/rpmbuild/SRPMS/yaesm-*.src.rpm

      - name: Check Fedora package
        run: |
          rpmlint \
            "$HOME/rpmbuild/SPECS/yaesm.spec" \
            dist/yaesm-*.src.rpm \
            dist/yaesm-*.noarch.rpm

      - name: Install and smoke-test Fedora package
        run: |
          dnf install --assumeyes --setopt=install_weak_deps=False \
            dist/yaesm-*.noarch.rpm
          yaesm --help
          systemd-analyze verify --man=no /usr/lib/systemd/system/yaesm.service

      - name: Upload Fedora package
        uses: actions/upload-artifact@v7
        with:
          path: dist/yaesm-*.noarch.rpm
          if-no-files-found: error
          archive: false
