name: build-manual
on:
  push:
    branches:
      - main
    paths:
      - 'man/yaesm.1.md'
      - 'pyproject.toml'
      - 'packaging/build-manual.sh'
      - 'packaging/check-manual.sh'
      - '.github/workflows/build-manual.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install pandoc
        run: sudo apt-get update -y && sudo apt-get install -y pandoc
      - name: Build man page
        run: sh packaging/build-manual.sh
      - name: Commit man page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add man/yaesm.1
          git diff --cached --quiet || git commit -m "Build man page from yaesm.1.md"
          git push
